# Prometheus scrape config for fapiao_cn.
#
# Enable the monitoring profile:  docker compose --profile monitoring up -d
# Visit http://localhost:9090 to query.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fapiao_cn
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8091
          - fapiao_cn:8091
        labels:
          service: fapiao_cn
          env: dev