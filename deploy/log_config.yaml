version: 1
disable_existing_loggers: false

formatters:
  default:
    (): logging.Formatter
    fmt: '%(asctime)s [%(levelname)s] %(message)s'
  access:
    (): uvicorn.logging.AccessFormatter
    fmt: '%(asctime)s [%(levelname)s] %(client_addr)s - "%(request_line)s" %(status_code)s'
  audit:
    (): logging.Formatter
    fmt: '%(asctime)s [AUDIT] %(message)s'

handlers:
  default:
    (): logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
  access:
    (): logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout
  audit_file:
    (): logging.handlers.RotatingFileHandler
    formatter: audit
    filename: logs/audit.log
    maxBytes: 10485760   # 10 MiB
    backupCount: 5
    encoding: utf-8

loggers:
  uvicorn.error:
    level: INFO
    handlers: [default]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: false
  fapiao_cn.audit:
    level: INFO
    handlers: [audit_file]
    propagate: false
