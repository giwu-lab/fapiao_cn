version: 1
disable_existing_loggers: false

formatters:
  default:
    (): logging.Formatter
    fmt: '%(asctime)s [%(levelname)s] %(message)s'
  access:
    (): uvicorn.logging.AccessFormatter
    fmt: '%(asctime)s [%(levelname)s] %(client_addr)s - "%(request_line)s" %(status_code)s'
  audit:
    (): logging.Formatter
    fmt: '%(asctime)s [AUDIT] %(message)s'

handlers:
  default:
    (): logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
  access:
    (): logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout
  audit_file:
    (): logging.handlers.RotatingFileHandler
    formatter: audit
    filename: logs/audit.log
    maxBytes: 10485760   # 10 MiB
    backupCount: 5
    encoding: utf-8

loggers:
  uvicorn.error:
    level: INFO
    handlers: [default]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: false
  fapiao_cn.audit:
    level: INFO
    handlers: [audit_file]
    propagate: false
  # fapiao_cn.server / fapiao_cn.auth 的 INFO 消息（密钥库加载确认、
  # SIGHUP 热加载确认等）此前没有任何 handler：它们向上 propagate 到
  # root，而 root 也没有 handler，于是 Python 的 lastResort 只处理
  # WARNING 以上的级别 —— 所有 INFO 级别的诊断信息被静默丢弃，
  # 运维在容器日志里看不到「已加载 N 把 API key」这类启动确认。
  # fapiao_cn.audit 自己有 handler 且 propagate=false，不会重复输出。
  fapiao_cn:
    level: INFO
    handlers: [default]
    propagate: false
