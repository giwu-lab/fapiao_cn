name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: lint + typecheck (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff mypy

      # Note: internal test suite + real invoice samples live in a
      # private verification environment and are not part of this
      # public repo.  Public CI runs lint + typecheck + docker smoke.
      - name: Ruff
        run: ruff check src

      - name: mypy (advisory)
        run: mypy src || true
        continue-on-error: true

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t fapiao_cn:ci .

      - name: Smoke test
        run: |
          docker run -d --name fapiao_cn_ci -p 18091:8091 fapiao_cn:ci
          for i in {1..20}; do
            if curl -fsS http://localhost:18091/health; then
              echo "OK"
              docker stop fapiao_cn_ci
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: /health did not respond"
          docker logs fapiao_cn_ci
          docker stop fapiao_cn_ci
          exit 1