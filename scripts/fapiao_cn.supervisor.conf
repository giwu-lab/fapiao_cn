; scripts/fapiao_cn.supervisor.conf
; Drop-in for Supervisor (Debian/Ubuntu: /etc/supervisor/conf.d/fapiao_cn.conf).
; Rendered by ``scripts/install_portable.sh --supervisor`` with the right
; DEST_DIR / user substituted in.
;
; Equivalent to scripts/fapiao_cn.service.template — keep the systemd unit
; and this Supervisor entry mutually exclusive (pick one daemon).
;
; Environment overrides (set in the ``environment=`` line below):
;     FC_HOST        bind host   (default 0.0.0.0)
;     FC_PORT        bind port   (default 8091)
;     FC_USER        system user (default fapiao_cn)

[program:fapiao_cn]
command=__DEST_DIR__/parse_vevn/bin/python -m uvicorn fapiao_cn.server:app
    --host %(ENV_FC_HOST)s
    --port %(ENV_FC_PORT)s
directory=__DEST_DIR__
user=__FC_USER__
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=__DEST_DIR__/logs/supervisor.out.log
stderr_logfile=__DEST_DIR__/logs/supervisor.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=FC_HOST="0.0.0.0",FC_PORT="8091",PYTHONUNBUFFERED="1"
priority=100