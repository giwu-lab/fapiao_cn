services:
  fapiao_cn:
    build:
      context: .
      dockerfile: Dockerfile
    image: fapiao_cn:1.3.1-ce
    container_name: fapiao_cn
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      FC_HOST: "${FC_HOST:-0.0.0.0}"
      FC_PORT: "${FC_PORT:-8091}"
      # 国税查验代理（默认关闭；开启时设置 VERIFY_ENDPOINT 指向你的代理）
      FC_VERIFY_ENABLED: "${FC_VERIFY_ENABLED:-false}"
      FC_VERIFY_ENDPOINT: "${FC_VERIFY_ENDPOINT:-}"
      FC_VERIFY_API_KEY:  "${FC_VERIFY_API_KEY:-}"
      FC_VERIFY_TIMEOUT:  "${FC_VERIFY_TIMEOUT:-15}"
      # 性能开关
      FC_CACHE_SIZE:    "${FC_CACHE_SIZE:-128}"
      FC_BATCH_WORKERS: "${FC_BATCH_WORKERS:-4}"
      # 文件大小（单文件上限 FC_MAX_FILE_MB 对 /invoice 与 /invoice/batch 同时生效）
      FC_MAX_FILE_MB:        "${FC_MAX_FILE_MB:-10}"
      FC_MAX_BATCH_FILES:    "${FC_MAX_BATCH_FILES:-50}"
      FC_MAX_BATCH_TOTAL_MB: "${FC_MAX_BATCH_TOTAL_MB:-500}"
      # API 鉴权（默认开启；两值都空时回退到 dev 模式 + WARN 日志）
      FC_API_AUTH_ENABLED: "${FC_API_AUTH_ENABLED:-true}"
      FC_API_KEYS:          "${FC_API_KEYS:-}"
      FC_API_KEYS_FILE:     "${FC_API_KEYS_FILE:-}"
      FC_API_KEY_DEFAULT_RPM:  "${FC_API_KEY_DEFAULT_RPM:-60}"
      FC_API_KEY_DEFAULT_BURST: "${FC_API_KEY_DEFAULT_BURST:-10}"
      FC_API_LEGACY_ALLOW: "${FC_API_LEGACY_ALLOW:-false}"
    volumes:
      - ./logs:/app/logs
     # - ./keys.json:/app/keys.json:ro  # 环境变量修改 ${FC_API_KEYS_FILE:/app/keys.json}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"